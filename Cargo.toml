[package]
name = "evolution_os"
version = "0.1.0"
edition = "2021"

[features]
default = []
llm = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[[bin]]
name = "evolution"
path = "src/main.rs"

[[bin]]
name = "planner_cli"
path = "src/bin/planner_cli.rs"

[[bin]]
name = "analyze_project"
path = "src/bin/analyze_project.rs"

[[bin]]
name = "demo_framework"
path = "src/bin/demo_framework.rs"

[[bin]]
name = "integration_demo"
path = "src/bin/integration_demo.rs"

[[bin]]
name = "evolution_agent"
path = "src/bin/evolution_agent.rs"

[lib]
name = "evolution_os"
path = "src/lib.rs"