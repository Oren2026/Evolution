[package]
name = "evolution_os"
version = "0.1.0"
edition = "2021"

[features]
default = []
llm = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
regex = "1.0"
reqwest = { version = "0.12", features = ["json", "blocking"] }

[[bin]]
name = "evolution"
path = "src/main.rs"

[lib]
name = "evolution_os"
path = "src/lib.rs"