name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            artifact_suffix: 'linux-x86_64'
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            artifact_suffix: 'macos-arm64'
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            artifact_suffix: 'macos-x86_64'
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            artifact_suffix: 'windows-x86_64'

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features llm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Package
        shell: bash
        run: |
          mkdir -p upload
          EXT="${{ matrix.ext }}"
          SUFFIX="${{ matrix.artifact_suffix }}"
          echo "=== Release binaries ==="
          ls target/release/ | head -20

          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin$EXT"
            if [ -f "$src" ]; then
              cp "$src" "upload/${bin}-${SUFFIX}"
              echo "Copied $src → upload/${bin}-${SUFFIX}"
            else
              echo "NOT FOUND: $src"
            fi
          done

          echo "=== Upload dir ==="
          ls -la upload/

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            upload/*
          body: |
            ## Evolution OS ${{ github.ref_name }}

            Multi-platform binary release.

            ### Binaries
            - `evolution-<suffix>` — Main executable
            - `planner_cli-<suffix>` — CLI planner
            - `analyze_project-<suffix>` — Project analyzer
            - `demo_framework-<suffix>` — Framework demo
            - `integration_demo-<suffix>` — Integration demo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}