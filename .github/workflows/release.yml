name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── Build all platforms in parallel ──────────────────────────────
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features llm

      - name: Package
        shell: bash
        run: |
          mkdir -p upload
          PLATFORM="${{ runner.os }}"
          ARCH="${{ matrix.target }}"
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin.exe"
            [ -f "$src" ] && cp "$src" "upload/${bin}-${PLATFORM,,}-${ARCH##*-}" || true
            src="target/release/$bin"
            [ -f "$src" ] && cp "$src" "upload/${bin}-${PLATFORM,,}-${ARCH##*-}" || true
          done
          ls upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}-bins
          path: upload/
          retention-days: 1

  # ── Create draft release (only once) ────────────────────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.id }}

    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        id: create
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Attach artifacts to release ────────────────────────────────
  attach-artifacts:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}-bins

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            upload/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}