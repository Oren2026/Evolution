name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTFLAGS: '-Awarnings'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        id: create
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          echo "tag=$TAG" >> $GITHUB_OUTPUT

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          mkdir -p upload
          EXT="${{ matrix.ext }}"
          SUFFIX="${{ matrix.suffix }}"
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin$EXT"
            [ -f "$src" ] && cp "$src" "upload/${bin}-${SUFFIX}"
          done

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        run: |
          if not exist upload mkdir upload
          for %%f in (evolution.exe planner_cli.exe analyze_project.exe demo_framework.exe integration_demo.exe) do (
            if exist "target\release\%%f" copy "target\release\%%f" "upload\%%f"
          )

      - name: Upload Release Asset (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          for f in upload/*; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" || echo "upload failed"
          done

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          for %%f in (upload\*) do gh release upload %TAG% "%%f" --repo %GITHUB_REPOSITORY%