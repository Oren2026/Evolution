name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --features llm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: true

      - name: Package
        shell: bash
        run: |
          mkdir -p upload
          PLATFORM="${{ runner.os }}"
          ARCH="${{ matrix.target }}"
          EXT="${{ matrix.ext }}"

          echo "=== Release binaries ==="
          ls target/release/

          # Copy all binaries with platform-architecture suffix
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin$EXT"
            if [ -f "$bin$EXT" ]; then
              cp "$bin$EXT" "upload/${bin}-${PLATFORM}-${ARCH}"
              echo "Copied (cwd) $bin$EXT"
            elif [ -f "$src" ]; then
              cp "$src" "upload/${bin}-${PLATFORM}-${ARCH}"
              echo "Copied $src"
            else
              echo "NOT FOUND: $bin$EXT"
            fi
          done

          echo "=== Upload dir ==="
          ls -la upload/ || echo "upload/ is empty"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-${{ matrix.target }}-bins
          path: upload/
          retention-days: 1

  create-release:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Extract tag
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.tag.outputs.version }} \
            --title "Evolution OS ${{ steps.tag.outputs.version }}" \
            --draft \
            --notes ""
          echo "release_url=https://github.com/${{ github.repository }}/releases/tag/${{ steps.tag.outputs.version }}" >> $GITHUB_OUTPUT

  attach:
    needs: [build, create-release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-bins'
          merge-multiple: true

      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.create-release.outputs.version }}"
          for f in *; do
            [ -f "$f" ] && gh release upload "$TAG" "$f" --clobber
          done