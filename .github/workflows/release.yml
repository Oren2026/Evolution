name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --features llm
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Package
        run: |
          mkdir -p upload
          EXT="${{ matrix.ext }}"
          SUFFIX="${{ matrix.suffix }}"
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin$EXT"
            [ -f "$src" ] && cp "$src" "upload/${bin}-${SUFFIX}"
          done
          echo "=== Upload ==="
          ls -la upload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bins-${{ matrix.suffix }}
          path: upload/
          retention-days: 1

  # ── Create draft release (only one job does this) ──────────────
  create-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release via gh CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" 2>/dev/null; then
            echo "Release already exists, skipping create"
          else
            gh release create "$TAG" \
              --draft \
              --repo "$GITHUB_REPOSITORY" \
              --title "Evolution OS $TAG" \
              --notes-file /dev/null
          fi

  # ── Attach all platform artifacts to the release ──────────────
  attach:
    needs: [build, create-release]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suffix: linux-x86_64
          - suffix: macos-arm64
          - suffix: macos-x86_64
          - suffix: windows-x86_64

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: bins-${{ matrix.suffix }}
          path: upload/

      - name: Attach to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF##*/}"
          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --add-asset upload/* || echo "Attach step done (assets may already be present)"