name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: true
        type: string

jobs:
  release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: evolution_os-${{ github.ref_name }}-linux-x86_64.tar.gz
            dir: release
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: evolution_os-${{ github.ref_name }}-macos-arm64.tar.gz
            dir: release
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: evolution_os-${{ github.ref_name }}-macos-x86_64.tar.gz
            dir: release
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: evolution_os-${{ github.ref_name }}-windows-x86_64.zip
            dir: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: target

      - name: Build release
        run: |
          cargo build --release --features llm
          # copy binaries with full names
          mkdir -p release
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            cp target/release/$bin release/$bin || true
          done

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: |
          cd release
          tar -czf ../${{ matrix.artifact }} *
          cd ..

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd release
          zip -r ../${{ matrix.artifact }} *
          cd ..

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ matrix.artifact }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}