name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
  RUSTFLAGS: '-Awarnings'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ''
            suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            suffix: macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: '.exe'
            suffix: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

      - name: Package
        shell: bash
        run: |
          mkdir -p upload
          EXT="${{ matrix.ext }}"
          SUFFIX="${{ matrix.suffix }}"
          for bin in evolution planner_cli analyze_project demo_framework integration_demo; do
            src="target/release/$bin$EXT"
            [ -f "$src" ] && cp "$src" "upload/${bin}-${SUFFIX}"
          done

      - name: Upload Release Asset (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          TAG="${TAG##*/}"
          for f in upload/*; do
            [ -f "$f" ] || continue
            echo "Uploading $f"
            gh release upload "$TAG" "$f" --repo "$GITHUB_REPOSITORY" || echo "skipped"
          done

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          for %%f in (upload\*) do gh release upload %TAG% "%%f" --repo %GITHUB_REPOSITORY%
